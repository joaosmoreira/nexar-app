name: "Build App"

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nexar v__VERSION__'
          releaseBody: 'Uma nova versão do Nexar Work Manager (Windows e macOS).'
          releaseDraft: false
          prerelease: false

      # Assinatura ad-hoc recursiva profunda (macOS)
      # O tauri-action assina apenas o binário principal.
      # Este passo assina TODOS os frameworks e libraries embebidos,
      # que é o que o Gatekeeper verifica antes de permitir a execução.
      - name: Deep ad-hoc sign macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          echo "A assinar recursivamente: $APP"
          # Remove assinaturas anteriores e faz deep sign
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +0111 \) | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          # Assina o bundle completo em modo deep
          codesign --force --deep --sign - "$APP"
          echo "Assinatura concluída."
          codesign --verify --deep --strict "$APP" && echo "✅ Verificação OK" || echo "⚠️ Verificação falhou"

      # Reempacota o DMG com a app já assinada corretamente
      - name: Repackage DMG with signed app
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          TMP_DIR=$(mktemp -d)

          echo "A reempacotar DMG com app assinada..."
          mkdir -p "$TMP_DIR/staging"
          cp -R "$APP" "$TMP_DIR/staging/"
          hdiutil create -volname "Nexar HUB" -srcfolder "$TMP_DIR/staging" -ov -format UDZO "$DMG"

          rm -rf "$TMP_DIR"
          echo "✅ DMG reempacotado"

      - name: Upload signed DMG to release
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
