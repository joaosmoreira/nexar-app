name: "Build App"
on: 
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: v${{ github.run_number }}
          releaseName: 'Nexar v${{ github.run_number }}'
          releaseBody: 'Nova versão do Nexar Work Manager (Windows e macOS).'
          releaseDraft: false
          prerelease: false

      # Processamento específico para macOS (Deep Sign e Repackage)
      - name: Deep ad-hoc sign macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +0111 \) | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          codesign --force --deep --sign - "$APP"
          
      - name: Repackage DMG with signed app
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          TMP_DIR=$(mktemp -d)
          mkdir -p "$TMP_DIR/staging"
          cp -R "$APP" "$TMP_DIR/staging/"
          hdiutil create -volname "Nexar HUB" -srcfolder "$TMP_DIR/staging" -ov -format UDZO "$DMG"
          rm -rf "$TMP_DIR"

      # Passo de Upload Unificado (Remove o "if: macos-latest")
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
